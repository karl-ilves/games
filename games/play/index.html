<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playard Games - Play Community 3D Games | Free Online Game Player</title>
    <meta name="description" content="Play community-created 3D games on Playard Games! Explore user-built worlds, adventure maps, racing circuits and interactive 3D simulations.">
    <meta name="keywords" content="playard community games, playard player, 3d user games, playard games">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.playardgames.com/games/play/index.html">
    <link rel="icon" type="image/svg+xml" href="../../assets/playard_logo.svg">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f141c;
            color: #d2dae2;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Top Player Bar */
        .player-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(20, 27, 36, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #2d3748;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-nav:hover {
            background: #3d4d65;
            transform: translateY(-2px);
        }

        /* Admin Review Bar (Only in review mode) */
        #admin-review-toolbar {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 35, 46, 0.95);
            backdrop-filter: blur(12px);
            border: 1.5px solid #ffd32a;
            border-radius: 40px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .btn-review-action {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; }
        .btn-changes { background: #f39c12; color: white; }
        .btn-review-action:hover { transform: scale(1.05); }

        /* Controls Overlay */
        .controls-overlay {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #00f2fe;
            z-index: 90;
            pointer-events: none;
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        /* On-Screen Easy D-Pad & Jump Controls */
        #play-screen-controls {
            position: fixed;
            bottom: 25px;
            left: 25px;
            right: 25px;
            pointer-events: none;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .touch-ctrl-btn {
            background: rgba(45, 55, 72, 0.9);
            border: 1.5px solid rgba(0, 242, 254, 0.6);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, background 0.1s;
        }
        .touch-ctrl-btn:active {
            background: #00f2fe;
            color: #111;
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="player-top-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="../../index.html" class="btn-nav" style="display: flex; align-items: center; gap: 8px;">
                <img src="../../assets/playard_logo.svg" alt="Playard Games Logo" style="width: 22px; height: 22px;">
                <span>Playard Games Hub</span>
            </a>
            <div>
                <h3 id="game-title-display" style="margin: 0; color: #fff; font-size: 1.1rem;">Loading Game...</h3>
                <div id="game-author-display" style="font-size: 0.8rem; color: #00f2fe;">By: Unknown</div>
            </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
            <div id="player-pbx-badge" style="display: flex; align-items: center; gap: 6px; background: rgba(0, 242, 254, 0.12); border: 1.5px solid rgba(0, 242, 254, 0.5); padding: 5px 14px; border-radius: 20px; font-weight: 800; font-size: 0.85rem; color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);">
                <span>💎</span>
                <span id="player-pbx-val">0</span> PBX
            </div>
            <div id="review-badge" style="display: none; background: rgba(255, 211, 42, 0.2); border: 1px solid #ffd32a; color: #ffd32a; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;">
                👑 ADMIN REVIEW MODE
            </div>
        </div>
    </div>

    <!-- Health HUD -->
    <div id="play-health-hud" style="position: absolute; top: 70px; right: 20px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1.5px solid rgba(231, 76, 60, 0.4); border-radius: 20px; padding: 6px 14px; display: flex; align-items: center; gap: 10px; z-index: 95; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <span style="font-size: 1.1rem;">❤️</span>
        <div style="width: 120px; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2);">
            <div id="play-health-bar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.2s, background 0.2s;"></div>
        </div>
        <span id="play-health-text" style="font-size: 0.82rem; font-weight: 800; color: #fff;">100/100</span>
    </div>

    <!-- Roblox-Style 10-Slot Inventory Hotbar (Game Player) -->
    <div id="play-roblox-hotbar-container" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; pointer-events: auto; user-select: none;">
        <div id="play-inventory-hud" style="display: flex; gap: 6px; padding: 6px; background: rgba(15, 20, 28, 0.65); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <!-- Equipped & collected items populate here in 10 slots (1-0) -->
        </div>
    </div>

    <!-- Interaction Dialog & Purchase Modal -->
    <div id="play-dialog-popup" style="display: none; position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96)); border: 2px solid #00f2fe; border-radius: 16px; padding: 14px 24px; color: #fff; z-index: 1200; box-shadow: 0 10px 40px rgba(0,242,254,0.4); backdrop-filter: blur(14px); min-width: 320px; max-width: 550px; text-align: center; pointer-events: auto;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px;">
            <span id="play-dialog-icon" style="font-size: 1.6rem;">✋</span>
            <strong id="play-dialog-title" style="color: #00f2fe; font-size: 1.05rem;">Ese</strong>
        </div>
        <div id="play-dialog-text" style="font-size: 1.05rem; font-weight: bold; color: #ffd32a; line-height: 1.4; margin-bottom: 12px;">
            Vajuta [E] eseme ostmiseks
        </div>
        <div id="play-dialog-actions" style="display: flex; justify-content: center; gap: 10px;">
            <button id="btn-play-buy-confirm" style="background: linear-gradient(135deg, #00f2fe, #3b82f6); border: none; color: #000; font-weight: 800; padding: 8px 20px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;">
                💎 Osta
            </button>
            <button id="btn-play-buy-cancel" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-weight: 600; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;">
                ✕ Sulge
            </button>
        </div>
    </div>

    <!-- Canvas -->
    <div id="canvas-container"></div>

    <!-- Controls Overlay -->
    <div class="controls-overlay">
        🎮 <strong>Controls:</strong> W / S to Move Forward & Backward | A / D or Mouse Drag to Turn View | SPACE to Jump
    </div>

    <!-- On-Screen Controls for easy movement -->
    <div id="play-screen-controls">
        <div style="pointer-events: auto; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; background: rgba(20,27,36,0.9); padding: 8px; border-radius: 20px; border: 1.5px solid rgba(0,242,254,0.4); box-shadow: 0 10px 25px rgba(0,0,0,0.6);">
            <div></div>
            <button id="touch-btn-up" class="touch-ctrl-btn" title="Move Forward">⬆️</button>
            <div></div>
            <button id="touch-btn-left" class="touch-ctrl-btn" title="Move Left">⬅️</button>
            <div></div>
            <button id="touch-btn-right" class="touch-ctrl-btn" title="Move Right">➡️</button>
            <div></div>
            <button id="touch-btn-down" class="touch-ctrl-btn" title="Move Backward">⬇️</button>
            <div></div>
        </div>

        <div style="pointer-events: auto;">
            <button id="touch-btn-jump" style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #00f2fe, #4facfe); border: 2px solid #fff; color: #111; font-weight: 900; font-size: 1.1rem; cursor: pointer; box-shadow: 0 8px 25px rgba(0,242,254,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <span>🚀</span>
                <span style="font-size: 0.75rem; font-weight: 800;">JUMP</span>
            </button>
        </div>
    </div>

    <!-- Admin Review Action Bar -->
    <div id="admin-review-toolbar" style="display: none;">
        <span style="font-weight: bold; color: #ffd32a; font-size: 0.95rem;">Admin Decision:</span>
        <button id="btn-review-approve" class="btn-review-action btn-approve">✅ Approve Game</button>
        <button id="btn-review-changes" class="btn-review-action btn-changes">⚠️ Request Changes</button>
        <button id="btn-review-reject" class="btn-review-action btn-reject">❌ Reject Game</button>
    </div>

    <script type="module" src="/src/games/play/main.ts"></script>
</body>
</html>
