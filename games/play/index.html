<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playard - Community Game Player</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f141c;
            color: #d2dae2;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Top Player Bar */
        .player-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(20, 27, 36, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 242, 254, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #2d3748;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-nav:hover {
            background: #3d4d65;
            transform: translateY(-2px);
        }

        /* Admin Review Bar (Only in review mode) */
        #admin-review-toolbar {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 35, 46, 0.95);
            backdrop-filter: blur(12px);
            border: 1.5px solid #ffd32a;
            border-radius: 40px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .btn-review-action {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; }
        .btn-changes { background: #f39c12; color: white; }
        .btn-review-action:hover { transform: scale(1.05); }

        /* Controls Overlay */
        .controls-overlay {
            position: absolute;
            top: 70px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #a4b0be;
            z-index: 90;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="player-top-bar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="../../index.html" class="btn-nav">
                <span>⬅</span> <span>Hub</span>
            </a>
            <div>
                <h3 id="game-title-display" style="margin: 0; color: #fff; font-size: 1.1rem;">Loading Game...</h3>
                <div id="game-author-display" style="font-size: 0.8rem; color: #00f2fe;">By: Unknown</div>
            </div>
        </div>

        <div id="review-badge" style="display: none; background: rgba(255, 211, 42, 0.2); border: 1px solid #ffd32a; color: #ffd32a; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;">
            👑 ADMIN REVIEW MODE
        </div>
    </div>

    <!-- Canvas -->
    <div id="canvas-container"></div>

    <!-- Controls Overlay -->
    <div class="controls-overlay">
        🎮 <strong>Controls:</strong> WASD to Walk | SPACE to Jump | Mouse to Look
    </div>

    <!-- Admin Review Action Bar -->
    <div id="admin-review-toolbar" style="display: none;">
        <span style="font-weight: bold; color: #ffd32a; font-size: 0.95rem;">Admin Decision:</span>
        <button id="btn-review-approve" class="btn-review-action btn-approve">✅ Approve Game</button>
        <button id="btn-review-changes" class="btn-review-action btn-changes">⚠️ Request Changes</button>
        <button id="btn-review-reject" class="btn-review-action btn-reject">❌ Reject Game</button>
    </div>

    <script type="module" src="/src/games/play/main.ts"></script>
</body>
</html>
