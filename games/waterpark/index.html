<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Playard Games - 🏖️ Build a Water Park</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/playard_logo.svg">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #060b11;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #e2e8f0;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        /* Top HUD Bar */
        #top-hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(10, 16, 26, 0.85) 0%, rgba(10, 16, 26, 0.4) 80%, transparent 100%);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            pointer-events: auto;
        }

        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-badge {
            background: rgba(14, 23, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00f2fe;
            box-shadow: 0 0 8px #00f2fe;
        }

        /* Bottom Floating Bar */
        #bottom-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 18, 28, 0.88);
            border: 1.5px solid rgba(0, 242, 254, 0.5);
            border-radius: 30px;
            padding: 8px 18px;
            backdrop-filter: blur(10px);
            z-index: 100;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .btn-action-main {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0b1320;
            font-size: 1rem;
            font-weight: 900;
            border: none;
            border-radius: 20px;
            padding: 10px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }
        .btn-action-main:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        .btn-action-delete {
            background: rgba(255, 71, 87, 0.2);
            border: 1.5px solid #ff4757;
            color: #ff6b81;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 20px;
            padding: 9px 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-action-delete:hover {
            background: #ff4757;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.5);
        }
        .btn-action-delete.active {
            background: #ff4757;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 71, 87, 0.8);
            border-color: #ffffff;
            animation: pulse-delete 1s infinite alternate;
        }
        @keyframes pulse-delete {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }

        /* Build Drawer */
        #build-drawer {
            display: none;
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 680px;
            background: rgba(14, 23, 38, 0.95);
            border: 1.5px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(14px);
            z-index: 110;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            max-height: 70vh;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-categories {
            display: flex;
            gap: 8px;
            padding-bottom: 4px;
        }

        .build-cat-tab {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .build-cat-tab.active {
            background: #00f2fe;
            color: #0b1320;
            border-color: #00f2fe;
        }

        .btn-subnav-back {
            background: rgba(255, 71, 87, 0.2);
            border: 1.5px solid #ff4757;
            color: #ff6b81;
            font-weight: 800;
            font-size: 0.88rem;
            padding: 7px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .btn-subnav-back:hover {
            background: #ff4757;
            color: #ffffff;
        }

        #build-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            overflow-y: auto;
            max-height: 48vh;
            padding-right: 4px;
        }

        .build-item-card {
            background: rgba(22, 34, 52, 0.75);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .build-item-card:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.08);
        }

        .card-icon {
            font-size: 2rem;
        }
        .card-title {
            font-weight: 800;
            font-size: 0.92rem;
            color: #ffffff;
        }
        .card-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            line-height: 1.35;
        }

        .btn-build-item {
            background: rgba(0, 242, 254, 0.2);
            border: 1px solid #00f2fe;
            color: #00f2fe;
            font-weight: 800;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-build-item:hover {
            background: #00f2fe;
            color: #0b1320;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>

    <!-- Top HUD Navigation (Ainult P nupp ja pealkiri) -->
    <header id="top-hud">
        <div class="hud-left">
            <div class="title-badge">
                <span class="live-dot"></span>
                <span>🏖️ Build a Water Park</span>
            </div>
        </div>
        <div class="hud-right" style="padding-right: 52px;">
            <!-- P nupp inGameMenu.ts poolt paremas ülanurgas -->
        </div>
    </header>

    <!-- Bottom Actions Toolbar -->
    <div id="bottom-bar">
        <button class="btn-action-main" id="btn-open-build">
            <span>🔨</span>
            <span>EHITA (AVA POOD)</span>
        </button>
        <button class="btn-action-delete" id="btn-delete-mode" title="Kustuta esemeid klõpsates neile">
            <span>🗑️</span>
            <span>KUSTUTA</span>
        </button>
    </div>

    <!-- Build Drawer (Pood) -->
    <div id="build-drawer">
        <div class="drawer-header">
            <h3 style="margin: 0; color: #00f2fe; display: flex; align-items: center; gap: 8px;">
                <span>🏗️ Veepargi Ehituspood</span>
            </h3>
            <button id="btn-close-drawer" style="background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer;">&times;</button>
        </div>
        <div class="drawer-categories">
            <button class="build-cat-tab active" id="tab-cat-pools">🏊 Basseinid</button>
            <button class="build-cat-tab" id="tab-cat-tubes">🌊 Veetorud</button>
        </div>
        <div id="drawer-subnav"></div>
        <div id="build-items-grid"></div>
    </div>

    <!-- Game Scripts -->
    <script type="module" src="/src/shared/inGameMenu.ts"></script>
    <script type="module" src="/src/games/waterpark/main.ts"></script>
</body>
</html>
