<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Metro - YouTube Thumbnail Frame</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #000;
            font-family: 'Montserrat', sans-serif;
        }
        #stage {
            position: relative;
            width: 1920px;
            height: 1080px;
            background: url('metro_clean_bg.jpg') center/cover no-repeat;
        }
        /* Cinematic Vignette & Ambient Glow */
        #vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(6, 11, 24, 0.4) 0%, rgba(3, 6, 14, 0.8) 60%, rgba(0, 0, 0, 0.95) 100%);
            box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.95);
        }
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        /* Main Center Hero Card */
        #hero-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            background: rgba(10, 16, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2.5px solid rgba(0, 242, 254, 0.55);
            border-radius: 36px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.9), 0 0 50px rgba(0, 242, 254, 0.35);
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
        }
        /* Top Brand Label */
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 215, 0, 0.12);
            border: 1.5px solid rgba(255, 215, 0, 0.6);
            border-radius: 50px;
            padding: 10px 28px;
            color: #ffd700;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }
        /* Giant Title */
        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: 105px;
            font-weight: 900;
            letter-spacing: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #00f2fe 60%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 50px rgba(0, 242, 254, 0.6);
            line-height: 1.05;
            margin: 0;
            padding-left: 20px;
        }
        /* Tag / Sub-label */
        .song-tag {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 12px;
            color: #0be881;
            text-shadow: 0 0 25px rgba(11, 232, 129, 0.8);
            text-transform: uppercase;
        }
        /* Center Logo Badge Row */
        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        .logo-img {
            width: 90px;
            height: 90px;
            filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.8));
        }
        .logo-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        /* Bottom Badges */
        #bottom-bar {
            position: absolute;
            bottom: 45px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .badge-pill {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 12px 30px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div id="stage">
        <div id="vignette"></div>
        <canvas id="particles" width="1920" height="1080"></canvas>

        <div id="hero-frame">
            <div class="brand-badge">
                <span>🎮</span>
                <span>PLAYARD GAMES</span>
                <span>👑</span>
            </div>

            <h1 class="hero-title">LAST METRO</h1>

            <div class="song-tag">ORIGINAL SONG</div>

            <div class="logo-row">
                <img class="logo-img" src="public/assets/playard_logo.svg" alt="Playard Logo">
                <span class="logo-title">OFFICIAL SOUNDTRACK</span>
            </div>
        </div>

        <div id="bottom-bar">
            <div class="badge-pill">🎧 HIGH FIDELITY AUDIO</div>
            <div class="badge-pill" style="border-color: #ffd700; color: #ffd700;">✨ PLAY AT PLAYARD.GAMES</div>
            <div class="badge-pill">🚇 3D MYSTERY ADVENTURE</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        for (let i = 0; i < 90; i++) {
            const x = Math.random() * 1920;
            const y = Math.random() * 1080;
            const r = Math.random() * 3 + 1;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 242, 254, ${Math.random() * 0.5 + 0.2})`;
            ctx.fill();
        }
    </script>
</body>
</html>
